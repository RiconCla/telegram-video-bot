services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REQUIRED_CHANNELS: ${REQUIRED_CHANNELS}
      REQUIRED_CHANNELS_RU: ${REQUIRED_CHANNELS_RU}
      CHECK_SUBSCRIPTION: ${CHECK_SUBSCRIPTION}
      # Бот ходит в Telegram напрямую (прокси не нужен). Прокси нужен только для
      # загрузки (yt-dlp) — см. DL_PROXY ниже. Если Telegram окажется недоступен
      # напрямую, раскомментируй и задай PROXY_HOST/PROXY_PORT (SOCKS5):
      # PROXY_HOST: ${PROXY_HOST}
      # PROXY_PORT: ${PROXY_PORT}
      ADMIN_ID: ${ADMIN_ID}
      REPORT_FREQUENCY: ${REPORT_FREQUENCY}
      REPORT_TIME: ${REPORT_TIME}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE}
      SUBSCRIPTION_REMINDER_SCHEDULE: ${SUBSCRIPTION_REMINDER_SCHEDULE}
      AUTOPOSTER_URL: ${AUTOPOSTER_URL}
      INGEST_SECRET: ${INGEST_SECRET}
      FORWARD_USER_ID: ${FORWARD_USER_ID}
      SHARED_INGEST_DIR: ${SHARED_INGEST_DIR}
      # ── Прокси для загрузки (yt-dlp + Instagram embed) → ss-proxy (SOCKS5) ──
      DL_PROXY: ${DL_PROXY:-socks5h://ss-proxy:1080}
    volumes:
      - ingest:/data/ingest
      - bot_data:/app/data
    networks:
      - autoposter_net   # как раньше — связь с autoposter (НЕ трогаем)
      - proxy_net        # внутренняя связь bot ↔ ss-proxy
    depends_on:
      - ss-proxy

  # SOCKS5-прокси поверх Shadowsocks-сервера: yt-dlp и Instagram embed ходят
  # в соцсети через него (сервер гео-блокируется). shadowsocks-rust sslocal
  # в дефолтном режиме = SOCKS5 на :1080, выход — в твой SS-сервер (SHADOWSOCKS_*).
  ss-proxy:
    image: ghcr.io/shadowsocks/sslocal-rust:latest
    restart: unless-stopped
    # entrypoint образа делает `exec "$@"`, поэтому первым аргументом обязателен
    # бинарник sslocal (иначе `exec -b …` → "illegal option").
    command:
      - sslocal
      - -b
      - 0.0.0.0:1080
      - -s
      - ${SHADOWSOCKS_HOST}:${SHADOWSOCKS_PORT}
      - -k
      - ${SHADOWSOCKS_PASSWORD}
      - -m
      - ${SHADOWSOCKS_METHOD}
    networks:
      - proxy_net

volumes:
  ingest:
    name: bots-autoposter-kpxqbs_ingest
    external: true
  bot_data:
    name: telegram-bot-data
    external: true

networks:
  autoposter_net:
    name: bots-autoposter-kpxqbs_default
    external: true
  proxy_net:
    driver: bridge
